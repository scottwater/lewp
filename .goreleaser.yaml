version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/lewp
    binary: lewp
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
        -X github.com/scottwater/lewp/internal/buildinfo.Version={{.Version}}
        -X github.com/scottwater/lewp/internal/buildinfo.Commit={{.ShortCommit}}
        -X github.com/scottwater/lewp/internal/buildinfo.Date={{.Date}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: scottwater
    name: lewp
